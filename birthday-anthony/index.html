<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tonyo's Solar Return</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@500;700&family=Noto+Sans+Symbols&display=swap" rel="stylesheet">
<style>
  /* Layout: a reading spread on a velvet table. Cards are dealt in rows,
     two sticky sky diagrams (the chart wheel, the solar return orbit)
     tie the scroll to the sky, and the letter ends on cardstock. */
  :root {
    color-scheme: dark;
    --velvet: #1b1430;
    --velvet-hi: #2c2150;
    --ink: #241c2e;
    --card: #efe3c8;
    --card-edge: #d9c69d;
    --gold: #caa04c;
    --gold-hi: #f6dc94;
    --gold-lo: #8a6424;
    --oxblood: #8e2a3a;
    --silver: #c3cfdf;
    --rose: #e79aa6;
    --text: #efe6d3;
    --muted: #b7aac8;

    --display: 'IM Fell English', 'EB Garamond', Georgia, serif;
    --caps: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
    --body: 'EB Garamond', Georgia, 'Times New Roman', serif;
    --hand: 'Caveat', 'Segoe Print', cursive;
    --glyph: 'Noto Sans Symbols', 'Segoe UI Symbol', 'DejaVu Sans', sans-serif;

    --foil: linear-gradient(115deg, #8a6424 0%, #e9c76f 18%, #fff0bd 30%, #c99a43 46%, #f2d27e 62%, #9b7330 80%, #e6c46c 100%);
    --tex-velvet: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='v'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .7  0 0 0 0 .6  0 0 0 0 1  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23v)'/></svg>");
    --tex-nap: radial-gradient(60% 40% at 18% 22%, #ffffff0d, transparent 70%), radial-gradient(55% 45% at 82% 68%, #ffffff0a, transparent 70%);
    --tex-grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .17  0 0 0 0 .08  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
    --tex-fox: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='500'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.02' numOctaves='4' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .38  0 0 0 0 .15  0 0 0 1.3 -.88'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  }

  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {
    margin: 0; min-height: 100%;
    font-family: var(--body); font-size: 18px; line-height: 1.6; color: var(--text);
    background-color: var(--velvet);
    background-image: var(--tex-velvet), var(--tex-nap),
      radial-gradient(120% 60% at 50% 0%, var(--velvet-hi), transparent 70%);
    overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--velvet); }
  ::selection { background: var(--gold); color: var(--ink); }
  button { font: inherit; }
  :focus-visible { outline: 2px dashed var(--gold-hi); outline-offset: 4px; }

  .wrap {
    position: relative; z-index: 2;
    max-width: 1080px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  section { position: relative; padding-block: 96px; }
  .eyebrow { font-family: var(--caps); letter-spacing: .22em; font-size: 14px; color: var(--gold); text-transform: lowercase; }
  .foil {
    background: var(--foil); background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 7s ease-in-out infinite alternate;
  }
  @keyframes shimmer { from { background-position: 0% 0; } to { background-position: 100% 0; } }
  h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 50px); line-height: 1.1; margin: 10px 0 18px; text-wrap: balance; }
  .prose { max-width: 62ch; }
  .prose p { margin: 0 0 1em; }

  /* ---------- Sky: three parallax star layers ---------- */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .sky i { position: absolute; left: 0; top: 0; width: 2px; height: 2px; border-radius: 50%; background: transparent; will-change: transform; }

  /* ---------- Progress: a moon riding a gold thread ---------- */
  .progress { position: fixed; z-index: 50; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 3px; background: rgba(202,160,76,.15); }
  .progress b { display: block; height: 100%; width: 0; background: var(--foil); }
  .progress svg { position: absolute; top: -7px; width: 16px; height: 16px; left: 0; transform: translateX(-8px); }

  /* ---------- Intro: the deck ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 80; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    padding: 24px max(16px, env(safe-area-inset-left, 0px));
    background-color: var(--velvet);
    background-image: var(--tex-velvet), var(--tex-nap), radial-gradient(70% 55% at 50% 45%, #3a2b63, transparent 75%);
    transition: opacity .9s ease, visibility .9s;
  }
  #intro.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  #intro .lead { font-family: var(--display); font-size: clamp(28px, 7vw, 46px); text-align: center; line-height: 1.15; margin: 0; }
  #intro .sub { font-family: var(--hand); font-size: 24px; color: var(--muted); margin: 0; }
  .deck { position: relative; width: min(190px, 46vw); aspect-ratio: 7 / 12; perspective: 1200px; }
  .deck .back, .deck .top { position: absolute; inset: 0; border-radius: 12px; }
  .deck .back { box-shadow: 0 2px 0 #0003; }
  .deck .back:nth-child(1) { transform: translate(-10px, 8px) rotate(-6deg); }
  .deck .back:nth-child(2) { transform: translate(8px, 6px) rotate(4deg); }
  .deck .back:nth-child(3) { transform: translate(-3px, 3px) rotate(-1.5deg); }
  .deck .top { transform-style: preserve-3d; transition: transform 1.3s cubic-bezier(.2,.8,.2,1); animation: bob 3s ease-in-out infinite; }
  .deck .top > div { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; overflow: hidden; }
  .deck .top .face { transform: rotateY(180deg); }
  #intro.opening .deck .top { animation: none; transform: translateY(-14%) rotateY(180deg) scale(1.12); }
  #intro.opening .sub { opacity: 0; transition: opacity .3s; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(.6deg); } }

  /* ---------- Tarot card shells ---------- */
  .art { display: block; width: 100%; height: 100%; }
  .cardback { background: #191230; box-shadow: inset 0 0 0 1px #0006; }
  .cardface {
    position: relative; height: 100%; border-radius: 12px; overflow: hidden;
    background: #1a1330; box-shadow: inset 0 0 0 5px var(--card), inset 0 0 0 7px var(--gold-lo);
    display: grid; grid-template-rows: auto 1fr auto;
  }
  .cardface .num { font-family: var(--glyph), var(--caps); text-align: center; color: var(--gold-hi); font-size: 15px; letter-spacing: .12em; padding-top: 14px; }
  .cardface .num.roman { font-family: var(--caps); }
  .cardface .pic { position: relative; min-height: 0; margin: 0 9px; overflow: hidden; }
  .cardface .pic svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cardface .name {
    margin: 0 12px 14px; padding: 5px 6px 4px; text-align: center;
    background: var(--card); background-image: var(--tex-grain);
    color: var(--ink); font-family: var(--hand); font-weight: 700; font-size: clamp(19px, 5vw, 22px); line-height: 1.05;
    box-shadow: 0 0 0 1px var(--gold-lo);
  }

  /* ---------- Flip cards in a spread ---------- */
  .spread { display: grid; gap: 34px 26px; justify-items: center; margin-top: 40px; }
  .spread.three { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .spread.four { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); max-width: 820px; margin-inline: auto; }
  .tcard {
    position: relative; width: min(270px, 100%); aspect-ratio: 7 / 12;
    perspective: 1400px; cursor: pointer; border: 0; padding: 0; background: none; color: inherit; text-align: left;
    transform: rotate(var(--tilt, 0deg));
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .tcard:hover { transform: rotate(0deg) translateY(-6px); }
  .tcard .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.3,.7,.2,1); }
  .tcard.flipped .inner { transform: rotateY(180deg); }
  .tcard .side { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; box-shadow: 0 18px 30px -12px #000a, 0 2px 0 #0004; }
  .tcard .reading {
    transform: rotateY(180deg);
    background-color: var(--card); background-image: var(--tex-grain), var(--tex-fox), radial-gradient(120% 90% at 50% 40%, transparent 55%, #b8955a55);
    color: var(--ink); padding: 22px 20px 18px;
    display: flex; flex-direction: column; gap: 10px; overflow: hidden;
    box-shadow: 0 18px 30px -12px #000a, inset 0 0 0 1px var(--card-edge);
  }
  .reading .rhead { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--hand); font-weight: 700; font-size: 20px; letter-spacing: .02em; color: var(--oxblood); border-bottom: 1px solid #8e2a3a44; padding-bottom: 6px; }
  .reading .rhead span:last-child { font-family: var(--glyph); letter-spacing: 0; font-size: 15px; }
  .reading p { margin: 0; font-family: var(--hand); font-weight: 500; font-size: clamp(20px, 5.4vw, 22px); line-height: 1.22; overflow-wrap: anywhere; }
  .reading .stamp {
    margin-top: auto; align-self: flex-end; font-family: var(--hand); font-size: 20px; color: var(--oxblood);
    transform: rotate(-4deg);
  }
  .tcard .hint {
    position: absolute; left: 50%; bottom: -28px; transform: translateX(-50%);
    font-family: var(--hand); font-size: 19px; color: var(--muted); white-space: nowrap; pointer-events: none;
  }
  .tcard.flipped .hint { opacity: 0; }

  /* reveal: visible at rest, animated only once script marks it ready */
  .rv { transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1); }
  .js .rv:not(.in) { opacity: 0; transform: translateY(40px); }
  .js .tcard.rv:not(.in) { transform: translateY(70px) rotate(calc(var(--tilt, 0deg) * 4)); }

  /* ---------- Hero ---------- */
  #hero { padding-top: 120px; text-align: center; }
  #hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(46px, 11vw, 112px); line-height: .98; margin: 14px 0 0; text-wrap: balance; }
  #hero h1 .emo { font-size: .55em; vertical-align: .25em; -webkit-text-fill-color: initial; color: initial; background: none; }
  .constel { width: min(520px, 100%); margin: 28px auto 0; display: block; overflow: visible; }
  .constel line { stroke: var(--gold); stroke-width: 1.2; stroke-linecap: round; }
  .constel circle { fill: var(--gold-hi); }
  .constel text { fill: var(--muted); font-family: var(--caps); font-size: 13px; letter-spacing: .18em; }
  .scroll-cue { margin-top: 24px; font-family: var(--hand); font-size: 22px; color: var(--muted); }

  /* ---------- Paper slip (letter opening) ---------- */
  .slip {
    position: relative; color: var(--ink);
    background-color: var(--card); background-image: var(--tex-grain), var(--tex-fox), linear-gradient(180deg, #fff7e2, transparent 40%);
    padding: 34px clamp(20px, 5vw, 44px) 30px; border-radius: 3px;
    box-shadow: 0 30px 50px -25px #000c, 0 1px 0 #fff8 inset;
    transform: rotate(-.8deg);
  }
  .slip::before, .slip::after {
    content: ""; position: absolute; width: 110px; height: 30px; top: -14px;
    background: repeating-linear-gradient(45deg, #c7a4d8bb 0 8px, #b48fcabb 8px 16px);
    box-shadow: 0 1px 2px #0003; opacity: .9;
  }
  .slip::before { left: 18px; transform: rotate(-5deg); }
  .slip::after { right: 18px; transform: rotate(4deg); }
  .slip p { margin: 0 0 1em; font-size: clamp(17px, 2.4vw, 20px); }
  .slip p:last-child { margin: 0; }

  /* ---------- Chart wheel (sticky) ---------- */
  #chart .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
  #chart .stick { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); }
  .wheel { width: 100%; max-width: 440px; display: block; margin: 0 auto; overflow: visible; }
  .wheel .ring { fill: none; stroke: var(--gold); }
  .wheel .spoke { stroke: var(--gold-lo); }
  .wheel .sign { font-family: var(--glyph); font-size: 17px; fill: var(--silver); text-anchor: middle; dominant-baseline: central; }
  .wheel .sign.hot { fill: var(--gold-hi); font-size: 20px; }
  .wheel .planet { font-family: var(--glyph); font-size: 20px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .wheel .pdot { stroke: var(--gold-hi); stroke-width: 1.5; }
  .wheel .trine { stroke: var(--silver); stroke-width: 1.4; stroke-dasharray: 4 5; fill: none; }
  .wheel .cap { font-family: var(--caps); font-size: 11px; letter-spacing: .14em; fill: var(--muted); text-anchor: middle; }
  .wheel-note { text-align: center; font-family: var(--hand); font-size: 20px; color: var(--muted); margin-top: 8px; }

  /* ---------- Portrait card ---------- */
  .portrait { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr); gap: 22px; align-items: start; margin-top: 34px; }
  .portrait .pcard { width: 100%; aspect-ratio: 7 / 12; transform: rotate(-2deg); box-shadow: 0 18px 30px -12px #000a; border-radius: 12px; }
  .portrait h3 { font-family: var(--hand); font-weight: 700; font-size: 34px; line-height: 1; color: var(--gold-hi); margin: 4px 0 6px; }
  .portrait .facts { font-family: var(--glyph), var(--body); font-size: 15px; color: var(--muted); margin: 0 0 10px; letter-spacing: .02em; }
  .portrait p { font-family: var(--hand); font-size: 22px; line-height: 1.25; margin: 0 0 .6em; }
  @media (max-width: 480px) { .portrait { grid-template-columns: minmax(0, 1fr); } .portrait .pcard { width: min(230px, 70vw); margin: 0 auto; } }

  /* ---------- Long letter: stacked cardstock pages ---------- */
  .pages { display: grid; gap: 28px; max-width: 700px; margin: 36px auto 0; }
  .page {
    position: relative; color: var(--ink);
    background-color: var(--card); background-image: var(--tex-grain), var(--tex-fox), linear-gradient(180deg, #fff7e2, transparent 40%);
    padding: 32px clamp(20px, 5vw, 48px) 30px; border-radius: 3px; box-shadow: 0 30px 50px -25px #000c;
    transform: rotate(var(--tilt, 0deg));
  }
  .page h3 { font-family: var(--display); font-style: italic; font-weight: 400; font-size: clamp(24px, 4.4vw, 30px); line-height: 1.15; margin: 0 0 12px; color: var(--oxblood); display: flex; gap: 12px; align-items: baseline; }
  .page h3 span { font-family: var(--glyph); font-style: normal; font-size: .8em; color: var(--gold-lo); }
  .page p { font-size: clamp(17px, 2.3vw, 19.5px); margin: 0 0 1em; }
  .page p:last-child { margin: 0; }
  .page .sign { font-family: var(--hand); font-size: 32px; color: var(--oxblood); text-align: right; }

  /* ---------- Solar return (sticky orbit) ---------- */
  #solar { padding-block: 0; height: 260vh; }
  #solar .stick { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; text-align: center; padding-block: 56px 24px; }
  .orbit { width: min(360px, 78vw, 46vh); overflow: visible; }
  .orbit .path { fill: none; stroke: #caa04c40; stroke-width: 1.5; stroke-dasharray: 2 6; }
  .orbit .trail { fill: none; stroke: url(#trailGrad); stroke-width: 3; stroke-linecap: round; }
  .orbit .natal { stroke: var(--rose); stroke-width: 2; }
  .orbit text { font-family: var(--caps); fill: var(--muted); font-size: 12px; letter-spacing: .14em; text-anchor: middle; }
  .orbit .count { font-family: var(--display); fill: var(--gold-hi); font-size: 54px; letter-spacing: 0; }
  #solarText { max-width: 40ch; font-size: clamp(18px, 2.6vw, 22px); margin: 0; }

  /* ---------- Gallery ---------- */
  .gallery { position: relative; margin-top: 30px; }
  .track { display: flex; transition: transform .6s cubic-bezier(.2,.8,.2,1); touch-action: pan-y; }
  .viewport { overflow: hidden; padding: 30px 0 40px; }
  .slide { flex: 0 0 100%; display: flex; justify-content: center; }
  .polaroid {
    width: min(330px, 84vw); background: #f7f2e8; background-image: var(--tex-grain);
    padding: 14px 14px 0; box-shadow: 0 24px 40px -18px #000d; position: relative;
    transform: rotate(var(--tilt, -2deg));
  }
  .polaroid::before {
    content: ""; position: absolute; top: -13px; left: 50%; width: 96px; height: 26px; transform: translateX(-50%) rotate(-3deg);
    background: repeating-linear-gradient(90deg, #e9c46acc 0 6px, #f3d68acc 6px 12px); box-shadow: 0 1px 2px #0003;
  }
  .polaroid .ph { aspect-ratio: 3 / 4; background: #241b3a; position: relative; overflow: hidden; display: grid; place-items: center; }
  .polaroid .ph.has { aspect-ratio: auto; background: none; }
  .polaroid img, .tframe img { display: block; width: 100%; height: auto; max-height: 64vh; object-fit: contain; }
  .slide { align-items: center; }
  .tframe {
    width: min(330px, 84vw); margin: 0; padding: 12px 12px 14px; border-radius: 14px; position: relative;
    background: #1a1330; box-shadow: inset 0 0 0 5px var(--card), inset 0 0 0 7px var(--gold-lo), 0 24px 40px -18px #000d;
    transform: rotate(var(--tilt, 1deg));
  }
  .tframe .num { font-family: var(--hand); font-size: 22px !important; color: var(--gold-hi); text-align: center; letter-spacing: .14em; font-size: 15px; padding: 6px 0 8px; }
  .tframe .ph { padding: 0 6px; display: grid; place-items: center; }
  .tframe .ph img { box-shadow: 0 0 0 1px var(--gold-lo); }
  .tframe .cap { margin: 10px 6px 0; padding: 4px 6px; text-align: center; background: var(--card); background-image: var(--tex-grain); color: var(--ink); font-family: var(--hand); font-weight: 700; font-size: 21px; min-height: 1.4em; box-shadow: 0 0 0 1px var(--gold-lo); }
  .polaroid img { width: 100%; height: auto; }
  .polaroid .empty { text-align: center; color: var(--muted); font-family: var(--hand); font-size: 22px; line-height: 1.2; padding: 16px; }
  .polaroid .empty svg { width: 74px; height: 74px; display: block; margin: 0 auto 10px; }
  .polaroid .cap { font-family: var(--hand); font-size: 23px; color: var(--ink); text-align: center; padding: 10px 6px 14px; min-height: 58px; }
  .gnav { display: flex; justify-content: center; align-items: center; gap: 20px; }
  .gbtn {
    width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--gold); background: #ffffff0d; color: var(--gold-hi);
    font-size: 22px; cursor: pointer; display: grid; place-items: center;
  }
  .gbtn:hover { background: #caa04c22; }
  .gcount { font-family: var(--caps); letter-spacing: .16em; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 70px; text-align: center; }

  /* ---------- Letter ---------- */
  .letter {
    position: relative; max-width: 680px; margin: 0 auto; color: var(--ink);
    background-color: #f3e8cf; background-image: var(--tex-grain), var(--tex-fox),
      linear-gradient(180deg, transparent 49.6%, #a0835033 50%, transparent 50.6%);
    padding: 48px clamp(22px, 6vw, 60px) 60px; border-radius: 2px;
    box-shadow: 0 40px 60px -30px #000d;
  }
  .letter p { font-size: clamp(18px, 2.4vw, 21px); margin: 0 0 1.1em; }
  .letter .last { font-family: var(--display); font-style: italic; font-size: clamp(24px, 4vw, 32px); line-height: 1.25; }
  .letter .sign { font-family: var(--hand); font-size: 34px; color: var(--oxblood); text-align: right; margin: 0; }
  .seal { position: absolute; width: 88px; height: 88px; right: -14px; top: -30px; transform: rotate(12deg); filter: drop-shadow(0 6px 6px #0007); }

  /* ---------- Song ---------- */
  .song-card {
    max-width: 520px; margin: 30px auto 0; padding: 14px 16px 12px; display: grid; gap: 8px; border-radius: 14px;
    background: #ffffff08; box-shadow: inset 0 0 0 1px #caa04c55;
  }
  .song-card.nudge { animation: nudge .8s ease 2; }
  @keyframes nudge { 50% { box-shadow: inset 0 0 0 2px var(--gold-hi), 0 0 30px #caa04c66; } }
  #songEmbed { min-height: 152px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; }
  #songLink { display: inline-block; color: var(--gold-hi); font-family: var(--hand); font-size: 22px; }
  #musicBtn {
    position: fixed; z-index: 55; width: 52px; height: 52px; border-radius: 50%; cursor: pointer;
    right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    border: 0; padding: 0; background: none; filter: drop-shadow(0 6px 10px #0009);
  }
  #musicBtn svg { width: 100%; height: 100%; display: block; }
  #musicBtn.playing svg { animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Message ---------- */
  .msg { max-width: 620px; margin: 0 auto; }
  .prompts { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 14px; }
  .prompt { font-family: var(--hand); font-size: 20px; color: var(--muted); border: 1px dashed #b7aac866; border-radius: 999px; padding: 2px 14px; }
  #wishText {

function cardFace(c) {
  const f = el('div', 'cardface');
  const num = el('div', 'num' + (c.roman ? ' roman' : ''), c.num);
  const pic = el('div', 'pic'); pic.innerHTML = ART[c.art]('a' + (uid++));
  pic.setAttribute('aria-hidden', 'true');
  f.append(num, pic, el('div', 'name', c.name));
  return f;
}

  if (pg.sign) d.append(el('p', 'sign', pg.sign));

function buildSpread(target, cards, tiltSeed) {
  cards.forEach((c, i) => {
    const b = el('button', 'tcard rv');
    b.type = 'button';
    b.style.setProperty('--tilt', (((i + tiltSeed) % 3) - 1) * 2.2 + 'deg');
    b.setAttribute('aria-label', c.name + '. Tap to read the card.');
    const inner = el('div', 'inner');
    const front = el('div', 'side'); front.append(cardFace(c));
    const back = el('div', 'side reading');
    const head = el('div', 'rhead'); head.append(el('span', null, c.head), el('span', null, c.glyph));
    back.append(head, el('p', null, c.text), el('div', 'stamp', L.ship.stamp));
    inner.append(front, back);
    b.append(inner, el('span', 'hint', L.ship.hint));
    b.addEventListener('click', () => {
      b.classList.toggle('flipped');
      b.setAttribute('aria-label', c.name + (b.classList.contains('flipped') ? '. Tap to turn back.' : '. Tap to read the card.'));
    });
    target.append(b);
  });
}

songLink.href = 'https://open.spotify.com/track/' + CONFIG.SPOTIFY_TRACK_ID;
songLink.textContent = CONFIG.song.linkText;

const M = CONFIG.message;
$('msgEyebrow').textContent = M.eyebrow;
$('msgTitle').textContent = M.title;
$('msgLabel').textContent = M.label;
M.prompts.forEach((t) => $('prompts').append(el('span', 'prompt', t)));
$('wishText').placeholder = M.placeholder;
$('sendBtn').textContent = M.sendLabel;
$('copyBtn').textContent = M.copyLabel;
$('msgNote').textContent = M.note;
$('footer').textContent = CONFIG.footer;

/* ---------- Scorpius, drawn star by star ---------- */
(function constellation() {
  const pts = [[30, 70], [58, 52], [70, 84], [62, 118], [128, 96], [176, 104], [214, 108], [250, 118], [286, 136], [318, 152], [352, 164], [392, 168], [430, 158], [458, 136], [470, 110], [452, 92], [440, 104]];
  const links = [[0, 2], [1, 2], [2, 3], [2, 4], [4, 5], [5, 6], [6, 7], [7, 8], [8, 9], [9, 10], [10, 11], [11, 12], [12, 13], [13, 14], [14, 15], [14, 16]];
  const s = $('constel');
  links.forEach(([a, b], i) => {
    const [x1, y1] = pts[a], [x2, y2] = pts[b];
    const len = Math.hypot(x2 - x1, y2 - y1);
    const ln = sv('line', { x1, y1, x2, y2, 'stroke-dasharray': len, 'stroke-dashoffset': reduceMotion ? 0 : len });
    if (!reduceMotion) ln.style.transition = `stroke-dashoffset .5s ease ${0.9 + i * 0.12}s`;
    s.append(ln);
  });
  pts.forEach(([x, y], i) => s.append(sv('circle', { cx: x, cy: y, r: i === 6 ? 4.5 : 2.6 })));
  const halo = sv('circle', { cx: 214, cy: 108, r: 10, fill: '#e79aa655' });
  s.append(halo);
  const t = sv('text', { x: 214, y: 192, 'text-anchor': 'middle' }); t.textContent = CONFIG.hero.constellation;
  s.append(t);
})();
function drawConstellation() { document.querySelectorAll('#constel line').forEach((l) => l.setAttribute('stroke-dashoffset', 0)); }

/* ---------- Chart wheel ---------- */
const SIGNS = ['♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'];
const polar = (deg, r) => { const a = (180 + deg) * Math.PI / 180; return [r * Math.cos(a), -r * Math.sin(a)]; };
const wheelRot = sv('g', {});
(function buildWheel() {
  const w = $('wheel');
  w.append(sv('circle', { r: 166, fill: '#ffffff06' }));
  [158, 120, 64].forEach((r, i) => w.append(sv('circle', { class: 'ring', r, 'stroke-width': i === 0 ? 2 : 1 })));
  w.append(wheelRot);
  for (let i = 0; i < 12; i++) {
    const [x1, y1] = polar(i * 30, 120), [x2, y2] = polar(i * 30, 158);
    wheelRot.append(sv('line', { class: 'spoke', x1, y1, x2, y2 }));
    const [ix, iy] = polar(i * 30, 64), [ox, oy] = polar(i * 30, 118);
    wheelRot.append(sv('line', { class: 'spoke', x1: ix, y1: iy, x2: ox, y2: oy, 'stroke-opacity': .4 }));
    const [gx, gy] = polar(i * 30 + 15, 139);
    const t = sv('text', { class: 'sign' + (i === 3 || i === 7 ? ' hot' : ''), x: gx, y: gy });
    t.textContent = SIGNS[i] + '︎';
    wheelRot.append(t);
  }
  const sun = polar(7 * 30 + 12, 94), moon = polar(3 * 30 + 18, 94);
  wheelRot.append(sv('line', { class: 'trine', x1: sun[0], y1: sun[1], x2: moon[0], y2: moon[1] }));
  [[sun, '☉', '#f1c45a'], [moon, '☽', '#c3cfdf']].forEach(([[x, y], gl, c]) => {
    wheelRot.append(sv('circle', { class: 'pdot', cx: x, cy: y, r: 15, fill: c }));
    const t = sv('text', { class: 'planet', x, y }); t.textContent = gl + '︎';
    wheelRot.append(t);
  });
  const cap = sv('text', { class: 'cap', x: 0, y: 5 }); cap.textContent = '25 · xi';
  w.append(cap);
})();

/* ---------- Gallery ---------- */
const photos = CONFIG.gallery.photos;
function roman(n) { const m = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let o = ''; for (const [v, r] of m) while (n >= v) { o += r; n -= v; } return o; }
let gi = 0;
photos.forEach((ph, i) => {
  const slide = el('div', 'slide');
  const asCard = i % 2 === 1;
  const pol = el('figure', asCard ? 'tframe' : 'polaroid');
  pol.style.margin = '0';
  pol.style.setProperty('--tilt', [-2, 1.6, -1, 2.2, -1.8, 1][i % 6] + 'deg');
  if (asCard) pol.append(el('div', 'num', roman(i + 1)));
  const box = el('div', 'ph' + (ph.src ? ' has' : ''));
  if (ph.src) {
    const img = el('img'); img.src = ph.src; img.alt = ph.caption || 'photo ' + (i + 1);
    img.loading = i < 2 ? 'eager' : 'lazy'; img.decoding = 'async';
    box.append(img);
  } else {
    const e = el('div', 'empty');
    e.innerHTML = `<svg viewBox="0 0 74 74" aria-hidden="true"><rect x="6" y="18" width="62" height="44" rx="6" fill="none" stroke="#caa04c" stroke-width="2"/><rect x="24" y="11" width="22" height="9" rx="2" fill="none" stroke="#caa04c" stroke-width="2"/><circle cx="37" cy="40" r="13" fill="none" stroke="#caa04c" stroke-width="2"/><path d="M37 33l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#f6dc94"/></svg>`;
    e.append(document.createTextNode(CONFIG.gallery.placeholder));
    box.append(e);
  }
  pol.append(box);
  if (ph.caption || !asCard) pol.append(el('figcaption', 'cap', ph.caption || ''));
  slide.append(pol);
  $('galTrack').append(slide);
});
function showSlide(n) {
  gi = (n + photos.length) % photos.length;
  $('galTrack').style.transform = `translateX(${-gi * 100}%)`;
  $('galCount').textContent = (gi + 1) + ' / ' + photos.length;
  [gi, gi + 1, gi - 1].forEach((k) => { const im = $('galTrack').children[(k + photos.length) % photos.length].querySelector('img'); if (im) im.loading = 'eager'; });
}
$('galPrev').addEventListener('click', () => showSlide(gi - 1));
$('galNext').addEventListener('click', () => showSlide(gi + 1));
(function swipe() {
  const v = $('galView'); let x0 = null;
  v.addEventListener('pointerdown', (e) => { x0 = e.clientX; });
  v.addEventListener('pointerup', (e) => {
    if (x0 == null) return;
    const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) showSlide(gi + (dx < 0 ? 1 : -1));
  });
  v.addEventListener('pointercancel', () => { x0 = null; });
})();
showSlide(0);

/* ---------- Sky: star fields as box-shadows on three layers ---------- */
function starField(n, size, color) {
  const out = [];
  const W = Math.max(window.innerWidth, 400), H = Math.max(window.innerHeight, 700) * 2.4;
  for (let i = 0; i < n; i++) out.push(`${Math.round(Math.random() * W)}px ${Math.round(Math.random() * H)}px 0 ${size}px ${color}`);
  return out.join(',');
}
const sky = [['sky1', 140, 0, '#efe6d3aa', .08], ['sky2', 60, .4, '#f6dc94cc', .2], ['sky3', 24, .9, '#ffffff', .38]];
sky.forEach(([id, n, s, c]) => { $(id).style.boxShadow = starField(n, s, c); });

/* ---------- Intro ---------- */
const intro = $('intro');
function openIntro() {
  if (intro.classList.contains('opening')) return;
  intro.classList.add('opening');
  startSong();
  setTimeout(() => {
    intro.classList.add('gone');
    $('musicBtn').hidden = false;
    drawConstellation();
    revealVisible();
  }, reduceMotion ? 300 : 2300);
}
intro.addEventListener('click', openIntro);
intro.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openIntro(); } });
intro.focus();

/* ---------- Spotify: plays inside the page, started by the intro tap ---------- */
let songCtl = null;
let songWanted = false;
let songPlaying = false;
window.onSpotifyIframeApiReady = (IFrameAPI) => {
  IFrameAPI.createController($('songEmbed'), {
    uri: 'spotify:track:' + CONFIG.SPOTIFY_TRACK_ID, width: '100%', height: '152'
  }, (ctl) => {
    songCtl = ctl;
    ctl.addListener('playback_update', (e) => {
      songPlaying = !!(e && e.data && !e.data.isPaused);
      $('musicBtn').classList.toggle('playing', songPlaying);
    });
    if (songWanted) ctl.play();
  });
};
function startSong() {
  songWanted = true;
  if (songCtl) songCtl.play();
}
function toggleSong() {
  if (!songCtl) { songLink.click(); return; }
  const wasPlaying = songPlaying;
  songCtl.togglePlay();
  // Some phones only let the player's own button start sound: if nothing
  // started, bring the player into view and point at it.
  if (!wasPlaying) setTimeout(() => {
    if (songPlaying) return;
    const card = document.querySelector('.song-card');
    card.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
    card.classList.remove('nudge'); void card.offsetWidth; card.classList.add('nudge');
  }, 1600);
}
$('musicBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleSong(); });

/* ---------- Reveal on scroll ---------- */
const rvEls = Array.from(document.querySelectorAll('.rv'));
function revealVisible() {
  rvEls.forEach((n) => { const r = n.getBoundingClientRect(); if (r.top < innerHeight * .92) n.classList.add('in'); });
}
if ('IntersectionObserver' in window && !reduceMotion) {
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  rvEls.forEach((n, i) => { n.style.transitionDelay = (n.classList.contains('tcard') ? (i % 4) * 0.12 : 0) + 's'; io.observe(n); });
} else {
  rvEls.forEach((n) => n.classList.add('in'));
}

/* ---------- Scroll-linked motion ---------- */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const orbitSun = $('orbitSun'), trail = $('orbitTrail'), lap = $('lapCount');
const trailLen = 2 * Math.PI * 140;
trail.style.strokeDasharray = trailLen;
let fired = false;
function sectionProgress(node) {
  const r = node.getBoundingClientRect();
  const span = r.height - innerHeight;
  return span > 0 ? clamp(-r.top / span, 0, 1) : (r.top < innerHeight * .5 ? 1 : 0);
}
function onScroll() {
  const doc = document.documentElement;
  const p = clamp(scrollY / Math.max(1, doc.scrollHeight - innerHeight), 0, 1);
  $('progBar').style.width = (p * 100) + '%';
  $('progMoon').style.left = (p * 100) + '%';

  if (!reduceMotion) {
    sky.forEach(([id, , , , sp]) => { $(id).style.transform = `translate3d(0, ${-scrollY * sp}px, 0)`; });
    const cr = $('chart').getBoundingClientRect();
    const cp = clamp(1 - (cr.top + cr.height / 2) / (innerHeight + cr.height / 2), 0, 1);
    wheelRot.setAttribute('transform', `rotate(${(cp - .5) * 70})`);
  }

  const sp = reduceMotion ? 1 : sectionProgress($('solar'));
  const f = clamp(sp / .85, 0, 1);
  const a = -Math.PI / 2 + f * 2 * Math.PI;
  orbitSun.setAttribute('transform', `translate(${140 * Math.cos(a)} ${140 * Math.sin(a)})`);
  trail.style.strokeDashoffset = trailLen * (1 - f);
  lap.textContent = f >= 1 ? '25' : '24';
  if (f >= 1 && !fired) { fired = true; fireworks(); }
  if (f < .6) fired = false;
}
let ticking = false;
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; onScroll(); }); } }, { passive: true });
addEventListener('resize', onScroll);
onScroll();

/* ---------- Trail, scroll sparkles, tap bursts (off for reduced motion) ---------- */
const glyphs = ['✦', '✧', '⋆', '☽', '✶', '♏'];
const tints = ['#f6dc94', '#efe6d3', '#e79aa6', '#c3cfdf'];
const introShowing = () => !intro.classList.contains('gone');
function trailAt(x, y) {
  const s = el('span', 'trail', glyphs[Math.floor(Math.random() * 3)]);
  s.style.left = x + 'px'; s.style.top = y + 'px';
  s.style.color = tints[Math.floor(Math.random() * tints.length)];
  s.style.setProperty('--dx', (Math.random() * 40 - 20).toFixed(0) + 'px');
  s.style.setProperty('--dy', (Math.random() * 40 + 10).toFixed(0) + 'px');
  document.body.appendChild(s);
  s.addEventListener('animationend', () => s.remove());
}
function burstAt(x, y, n, spread) {
  for (let i = 0; i < n; i++) {
    const s = el('span', 'burst', glyphs[i % glyphs.length] + '︎');
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.color = tints[i % tints.length];
    const ang = Math.random() * Math.PI * 2, d = spread * (.4 + Math.random() * .6);
    s.style.setProperty('--x', (Math.cos(ang) * d).toFixed(0) + 'px');
    s.style.setProperty('--y', (Math.sin(ang) * d - 30).toFixed(0) + 'px');
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}
function fireworks() {
  if (reduceMotion) return;
  const o = $('orbit').getBoundingClientRect();
  [[.5, .5, 0], [.15, .2, 260], [.85, .25, 480], [.3, .85, 700], [.75, .8, 900]].forEach(([fx, fy, t]) =>
    setTimeout(() => burstAt(o.left + o.width * fx, o.top + o.height * fy, 16, 140), t));
}
if (!reduceMotion) {
  let lastTrail = 0;
  addEventListener('pointermove', (e) => {
    if (introShowing()) return;
    const now = performance.now();
    if (now - lastTrail < 45) return;
    lastTrail = now;
    trailAt(e.clientX, e.clientY);
  }, { passive: true });
  let lastScroll = 0;
  addEventListener('scroll', () => {
    if (introShowing()) return;
    const now = performance.now();
    if (now - lastScroll < 160) return;
    lastScroll = now;
    for (let i = 0; i < 2; i++) trailAt(Math.random() * innerWidth, Math.random() * innerHeight * .9);
  }, { passive: true });
  document.addEventListener('click', (e) => {
    if (e.target.closest('#intro') || e.target.closest('textarea') || e.target.closest('#musicBtn')) return;
    burstAt(e.clientX, e.clientY, 9, 90);
  });
}

/* ---------- Message box: sends through the Apps Script, or copies ---------- */
const wishText = $('wishText');
const msgStatus = $('msgStatus');
const say = (k) => { msgStatus.textContent = M.status[k]; };
// Send: open a Gmail draft addressed to Yezsa with his message in it.
// iPhone: the Gmail app's own link, falling back to Gmail on the web if the app
// is not installed. Android and computers: Gmail's compose page (Android hands
// it to the Gmail app).
$('sendBtn').addEventListener('click', () => {
  const text = wishText.value.trim();
  if (!text) return say('empty');
  say('sending');
  const to = encodeURIComponent(CONFIG.EMAIL_TO);
  const su = encodeURIComponent(CONFIG.EMAIL_SUBJECT);
  const body = encodeURIComponent(text);
  const web = `https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${su}&body=${body}`;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  try {
    if (isIOS) {
      const started = Date.now();
      setTimeout(() => { if (!document.hidden && Date.now() - started < 2500) location.href = web; }, 1200);
      location.href = `googlegmail:///co?to=${to}&subject=${su}&body=${body}`;
      say('sent');
    } else {
      // no 'noopener' feature here: with it, window.open always returns null
      const w = window.open(web, '_blank');
      if (w) w.opener = null; else location.href = web;
      say('sent');
    }
  } catch (err) {
    say('failed');
  }
});
$('copyBtn').addEventListener('click', async () => {
  const text = wishText.value.trim();
  if (!text) return say('copyEmpty');
  try {
    await navigator.clipboard.writeText(text);
    say('copied');
  } catch (err) {
    wishText.select();
    say('copyFailed');
  }
});
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
