name: Build Redraft for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'redraft/**'
      - '.github/workflows/redraft-windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: redraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: redraft/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Redraft-Setup
          path: redraft/dist/*.exe
      - name: End-to-end tests (real app, mouse + keyboard)
        run: npm run test:e2e
